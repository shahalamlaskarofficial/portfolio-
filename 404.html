<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      // Handles both /project/slug and /repo-name/project/slug (with or without .html)
      var projectMatch = path.match(/^(.*?)\/projects?\/([^\/]+)\/?$/i);
      if (projectMatch) {
        var base = projectMatch[1] || "";
        var slug = projectMatch[2].replace(/\.html$/i, "");
        window.location.replace(base + "/#project/" + encodeURIComponent(slug));
        return;
      }

      // Fallback to site root (or repo root on *.github.io)
      var segments = path.split("/").filter(Boolean);
      var isGithubIo = window.location.hostname.endsWith("github.io");
      var rootBase = isGithubIo && segments.length > 0 ? "/" + segments[0] + "/" : "/";
      window.location.replace(rootBase);
    })();
  </script>
</head>
<body>
  <div>
    <p>Taking you to the right page…</p>
    <p><a href="./">Return to Homepage</a></p>
  </div>
</body>
</html>
