    /* =========================================================================
       DESIGN SYSTEM — DEEP OBSIDIAN & ELECTRIC BLUE 3D ATMOSPHERE
    ========================================================================= */
    :root {
      --bg-void: #02050d;
      --bg-deep: #050b18;
      --bg-surface: rgba(8, 15, 30, 0.72);
      --bg-surface-strong: rgba(10, 19, 38, 0.88);
      --bg-pill: rgba(12, 22, 42, 0.65);
      --border: rgba(96, 165, 250, 0.16);
      --border-bright: rgba(56, 189, 248, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --electric: #38bdf8;
      --cobalt: #2563eb;
      --indigo: #6366f1;
      --emerald: #10b981;
      --danger: #f87171;
      --glow-blue: 0 0 28px rgba(37, 99, 235, 0.45), 0 0 64px rgba(56, 189, 248, 0.2);
      --glow-soft: 0 18px 50px rgba(0, 0, 0, 0.65);
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --container: 1180px;
      --nav-h: 76px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      --bg-void: #eef4ff;
      --bg-deep: #e2ecff;
      --bg-surface: rgba(255, 255, 255, 0.78);
      --bg-surface-strong: rgba(255, 255, 255, 0.94);
      --bg-pill: rgba(255, 255, 255, 0.8);
      --border: rgba(37, 99, 235, 0.16);
      --border-bright: rgba(37, 99, 235, 0.48);
      --text-primary: #061024;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --electric: #0284c7;
      --cobalt: #1d4ed8;
      --glow-blue: 0 10px 28px rgba(37, 99, 235, 0.25);
      --glow-soft: 0 18px 40px rgba(15, 23, 42, 0.09);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      background: var(--bg-void);
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg-void);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background-color 350ms var(--ease), color 350ms var(--ease);
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    img, svg { display: block; }

    :focus-visible {
      outline: 2px solid var(--electric);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 22px;
      position: relative;
      z-index: 2;
    }
